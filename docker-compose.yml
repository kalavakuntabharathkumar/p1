services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/security_review
    ports: ["8001:8001"]
    depends_on: [postgres]
volumes:
  pgdata:
